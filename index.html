<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秘書のくま吉</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec;--card:#fff;--accent:#99D6D3;--accent2:#FFBBC6;--muted:#b0a0a8;
  --text:#3a3a2e;--border:#DDCCB6;--red:#FFA333;--yellow:#FFE088;--blue:#99D6D3;
  --orange:#FFA333;--yellow-green:#CCD933;--deep-pink:#FF6699;--pink:#FFBBC6;
  --shadow:0 2px 12px rgba(255,102,153,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh}

/* ナビ */
#nav{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
#nav .logo{font-family:'DM Serif Display',serif;font-size:1.15rem;color:var(--accent);margin-right:12px}
.nav-btn{background:none;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-size:0.85rem;color:var(--muted);transition:all .2s}
.nav-btn.active,.nav-btn:hover{background:var(--accent);color:#fff}
#nav .spacer{flex:1}
#undo-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 12px;font-size:0.78rem;color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;display:none}
#undo-btn:hover{border-color:var(--accent);color:var(--accent)}

/* メインコンテンツ */
#main{padding:20px;max-width:1100px;margin:0 auto}

/* 今日ビュー */
.today-top{display:flex;gap:20px;margin-bottom:20px;align-items:flex-start}
.today-char-area{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:160px;cursor:pointer}
.today-char-area:hover .char-bubble{border-color:var(--accent2)}
.char-bubble{background:#fff;border:1.5px solid var(--border);border-radius:14px 14px 14px 0;padding:8px 12px;font-size:0.78rem;max-width:180px;line-height:1.6;color:var(--text);text-align:center;transition:border-color .2s}
#char-img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,0.15))}
.today-stats-area{flex:1;display:flex;flex-direction:column;gap:10px}
.today-date-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.today-date{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--accent)}
/* 円形プログレス */
.circle-wrap{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 16px}
.circle-svg{width:64px;height:64px}
.circle-bg{fill:none;stroke:var(--border);stroke-width:7}
.circle-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.circle-info{display:flex;flex-direction:column;gap:2px}
.circle-pct-text{font-family:'DM Mono',monospace;font-size:1rem;font-weight:700;color:var(--accent)}
.circle-sub-text{font-size:0.72rem;color:var(--muted)}
.circle-svg text.cpct{font-size:0.85rem;fill:var(--accent);font-family:'DM Mono',monospace;font-weight:700}
.circle-svg text.csub{font-size:0.58rem;fill:var(--muted);font-family:'DM Mono',monospace}

.time-block{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden}
.block-header{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);background:rgba(92,124,106,0.04)}
.block-label{font-weight:700;font-size:0.83rem;color:var(--accent)}
.block-progress{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.block-progress-inner{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.block-count{font-size:0.72rem;color:var(--muted);font-family:'DM Mono',monospace}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border);transition:background .15s}
.task-item:last-child{border-bottom:none}
.task-item:hover{background:rgba(0,0,0,0.015)}
.task-item.done{opacity:.5}
.task-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.task-name{flex:1;font-size:0.86rem}
.task-name.done{text-decoration:line-through;color:var(--muted)}
.task-duration{font-size:0.72rem;color:var(--muted);font-family:'DM Mono',monospace}
.task-del{background:none;border:none;cursor:pointer;color:var(--red);font-size:0.82rem;opacity:0;transition:opacity .2s;padding:2px 4px}
.task-item:hover .task-del{opacity:.6}
.add-block-btn{width:100%;background:none;border:none;padding:8px;color:var(--accent2);font-size:0.78rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif}
.add-block-btn:hover{background:rgba(92,124,106,0.06)}

/* カレンダー */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-nav button{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:0.85rem}
.cal-nav h2{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-header{text-align:center;font-size:0.7rem;color:var(--muted);padding:4px;font-weight:700}
.cal-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;min-height:68px;padding:5px;cursor:pointer;transition:all .15s}
.cal-cell:hover{border-color:var(--accent2)}
.cal-cell.other-month{opacity:.35}
.cal-cell.today-cell{border-color:var(--accent);border-width:2px}
.cal-date-num{font-size:0.72rem;font-weight:700;color:var(--muted);font-family:'DM Mono',monospace}
.cal-cell.today-cell .cal-date-num{color:var(--accent)}
.cal-task-mini{font-size:0.58rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 4px;border-radius:3px;color:#fff;position:relative;z-index:1}
.cal-task-mini.span-start{border-radius:3px 0 0 3px;margin-right:0}
.cal-task-mini.span-mid{border-radius:0;margin:2px 0 0 0;padding-left:3px;opacity:0.85}
.cal-task-mini.span-mid .span-text{visibility:hidden}
.cal-task-mini.span-end{border-radius:0 3px 3px 0;margin-left:0;opacity:0.85}
.cal-task-mini.span-end .span-text{visibility:hidden}
.cal-task-mini.span-single{border-radius:3px}
/* カレンダー下部締め切り */
#cal-bottom{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
#cal-bottom h3{font-size:0.83rem;font-weight:700;color:var(--accent);margin-bottom:10px}
.deadline-item{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:0.8rem}
.deadline-item:last-child{border-bottom:none}
.dl-badge{padding:2px 8px;border-radius:10px;font-size:0.68rem;font-weight:700;color:#fff;white-space:nowrap}
.dl-urgent{background:var(--red)}
.dl-soon{background:var(--yellow)}
.dl-ok{background:var(--accent)}

/* ボード */
.board-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.board-header h2{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--accent)}
.month-tab{padding:4px 12px;border:1px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:0.78rem;font-family:'Noto Sans JP',sans-serif;transition:all .2s}
.month-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.board-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:10px}
.board-col{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.board-col-header{padding:9px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.col-color{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.col-title{font-weight:700;font-size:0.83rem;flex:1}
.col-toggle{font-size:0.75rem;color:var(--muted);cursor:pointer;transition:transform .2s;padding:2px 4px}
.col-toggle.collapsed{transform:rotate(-90deg)}
.col-del-btn{background:none;border:none;cursor:pointer;color:var(--red);font-size:0.8rem;opacity:0;transition:opacity .2s;padding:2px 4px}
.board-col-header:hover .col-del-btn{opacity:.6}
.board-col-body{overflow:hidden;transition:max-height .3s ease;max-height:1000px}
.board-col-body.collapsed{max-height:0}
.subtask-row{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;font-size:0.82rem}
.subtask-row:hover{background:rgba(0,0,0,0.015)}
.subtask-row.selected{background:rgba(92,124,106,0.09)}
.subtask-check{width:14px;height:14px;accent-color:var(--accent);flex-shrink:0}
.subtask-name{flex:1}
.subtask-name.done{text-decoration:line-through;color:var(--muted)}
.subtask-dur{font-size:0.68rem;color:var(--muted);font-family:'DM Mono',monospace}
.subtask-delete{background:none;border:none;cursor:pointer;color:var(--red);font-size:0.8rem;opacity:0;transition:opacity .2s}
.subtask-row:hover .subtask-delete{opacity:.6}
.carryover-badge{background:rgba(212,168,67,0.15);border:1px solid var(--yellow);border-radius:3px;font-size:0.62rem;padding:1px 4px;color:#a07020}
.add-subtask-btn{width:100%;background:none;border:none;padding:7px 13px;color:var(--accent2);font-size:0.76rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;text-align:left}
.add-subtask-btn:hover{background:rgba(92,124,106,0.06)}

/* 詳細パネル */
#detail-panel{position:fixed;top:0;right:-400px;width:360px;height:100vh;background:var(--card);border-left:1px solid var(--border);box-shadow:-4px 0 20px rgba(0,0,0,0.09);transition:right .3s ease;z-index:200;overflow-y:auto;padding:20px}
#detail-panel.open{right:0}
#detail-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted);float:right}
#detail-title{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--text);margin:28px 0 12px}
.detail-field{margin-bottom:11px}
.detail-field label{display:block;font-size:0.72rem;color:var(--muted);margin-bottom:3px;font-weight:700}
.detail-field input,.detail-field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-family:'Noto Sans JP',sans-serif;font-size:0.83rem;background:var(--bg);color:var(--text);resize:vertical}
.detail-field textarea{min-height:65px}
.checklist-item{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.checklist-item input[type=checkbox]{accent-color:var(--accent)}
.checklist-item input[type=text]{flex:1;border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-size:0.8rem;font-family:'Noto Sans JP',sans-serif;background:var(--bg)}
.checklist-del{background:none;border:none;cursor:pointer;color:var(--red);font-size:0.8rem}
.save-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px;font-size:0.88rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:700;margin-top:6px}
.save-btn:hover{background:#4a6858}
.del-btn{width:100%;background:none;border:1px solid var(--red);color:var(--red);border-radius:10px;padding:7px;font-size:0.83rem;cursor:pointer;margin-top:7px}

/* 設定 */
#settings-view{max-width:460px}
.setting-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:12px}
.setting-section h3{font-weight:700;font-size:0.88rem;margin-bottom:11px;color:var(--accent)}
.setting-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.setting-row label{font-size:0.8rem;color:var(--muted);width:75px;flex-shrink:0}
.setting-row input{flex:1;border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-family:'Noto Sans JP',sans-serif;font-size:0.83rem;background:var(--bg)}
.setting-row button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:5px 13px;cursor:pointer;font-size:0.8rem}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.32);z-index:300;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border-radius:16px;padding:22px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.13)}
.modal h3{font-family:'DM Serif Display',serif;font-size:1.05rem;margin-bottom:13px;color:var(--accent)}
.modal-field{margin-bottom:9px}
.modal-field label{display:block;font-size:0.72rem;color:var(--muted);margin-bottom:3px}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-family:'Noto Sans JP',sans-serif;font-size:0.83rem;background:var(--bg)}
.modal-btns{display:flex;gap:8px;margin-top:13px}
.modal-btns button{flex:1;padding:7px;border-radius:8px;border:none;cursor:pointer;font-size:0.83rem;font-family:'Noto Sans JP',sans-serif}
.btn-ok{background:var(--accent);color:#fff;font-weight:700}
.btn-cancel{background:var(--border);color:var(--text)}
.cal-modal-task{padding:5px 9px;border-radius:7px;font-size:0.8rem;margin-bottom:3px;color:#fff}
</style>
</head>
<body>
<div id="nav">
  <span class="logo">🐾 秘書のくま吉</span>
  <button class="nav-btn active" onclick="showView('today')">今日</button>
  <button class="nav-btn" onclick="showView('calendar')">カレンダー</button>
  <button class="nav-btn" onclick="showView('alltasks')">全タスク</button>
  <button class="nav-btn" onclick="showView('monthly')">月別</button>
  <button class="nav-btn" onclick="showView('commissions')">制作依頼</button>
  <button class="nav-btn" onclick="showView('settings')">設定</button>
  <span class="spacer"></span>
  <button id="undo-btn" onclick="doUndo()" title="元に戻す (Ctrl+Z)">↩ 元に戻す</button>
</div>
<div id="main">
  <div id="today-view"></div>
  <div id="calendar-view" style="display:none"></div>
  <div id="alltasks-view" style="display:none"></div>
  <div id="monthly-view" style="display:none"></div>
  <div id="commissions-view" style="display:none"></div>
  <div id="settings-view" style="display:none"></div>
</div>
<div id="detail-panel">
  <button id="detail-close" onclick="closeDetail()">✕</button>
  <div id="detail-title"></div>
  <div id="detail-body"></div>
</div>
<div id="modal-container"></div>

<script>
// ===================== データ =====================
const KEY = 'task-sec-v6';
const CHECKS_KEY = 'kumakichi-checks'; // チェック状態は別保存（リセットで消えない）
let undoStack = [];

function loadChecks(){
  try{ return JSON.parse(localStorage.getItem(CHECKS_KEY))||{}; }catch(e){ return {}; }
}
function saveChecks(checks){
  localStorage.setItem(CHECKS_KEY, JSON.stringify(checks));
}
function applyChecks(db){
  // 保存済みチェック状態をDBに適用
  const checks = loadChecks();
  db.projects.forEach(p=>{
    p.subtasks.forEach(s=>{
      const k = p.id+'_'+s.id;
      if(checks[k] !== undefined) s.done = checks[k];
    });
  });
  return db;
}
function load(){
  try{
    const db = JSON.parse(localStorage.getItem(KEY))||defaultData();
    return applyChecks(db);
  }catch(e){ return applyChecks(defaultData()); }
}
function save(d, pushUndo=true){
  if(pushUndo){
    undoStack.push(JSON.stringify(d));
    if(undoStack.length > 30) undoStack.shift();
    document.getElementById('undo-btn').style.display = undoStack.length > 1 ? '' : 'none';
  }
  // チェック状態を別途保存
  const checks = loadChecks();
  d.projects.forEach(p=>{
    p.subtasks.forEach(s=>{
      checks[p.id+'_'+s.id] = s.done;
    });
  });
  saveChecks(checks);
  localStorage.setItem(KEY, JSON.stringify(d));
}
function doUndo(){
  if(undoStack.length <= 1){ return; }
  undoStack.pop();
  const prev = undoStack[undoStack.length-1];
  DB = JSON.parse(prev);
  localStorage.setItem(KEY, prev);
  document.getElementById('undo-btn').style.display = undoStack.length > 1 ? '' : 'none';
  showView(currentView);
  setBubble('元に戻したよ！');
}
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='z'){ e.preventDefault(); doUndo(); }
});

          {id:'g1s5',text:'タン・カス・タネの図柄を全月分描く',done:false,startDate:'2026-09-23',endDate:'2026-09-30',duration:360,memo:'',notes:'',checks:[],carryover:false},
          {id:'g1s6',text:'光札（役札）4枚のデザイン',done:false,startDate:'2026-10-01',endDate:'2026-10-02',duration:180,memo:'',notes:'',checks:[],carryover:false},
          {id:'g1s7',text:'全48枚のデジタル仕上げ・色調整',done:false,startDate:'2026-10-05',endDate:'2026-10-10',duration:360,memo:'',notes:'',checks:[],carryover:false},

function praiseSpeech(){ setBubble(praiseSpeeches[Math.floor(Math.random()*praiseSpeeches.length)]); }
function setBubble(text){ document.getElementById('char-bubble').textContent=text; }
function updateCharImg(){
  const img=document.getElementById('char-img');
  if(DB.charImg){ img.src='data:image/png;base64,'+DB.charImg; }

// ===================== ビュー切り替え =====================
function showView(v){
  currentView=v;
  ['today','calendar','alltasks','monthly','commissions','settings'].forEach(x=>{
    document.getElementById(x+'-view').style.display=x===v?'':'none';
  });
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    b.classList.toggle('active',['today','calendar','alltasks','monthly','commissions','settings'][i]===v);
  });
  closeDetail();

  if(v==='calendar') renderCalendar();
  if(v==='alltasks') renderAllTasks();
  if(v==='monthly') renderMonthly();

}

// ===================== 今日ビュー =====================
function renderToday(){
  const el=document.getElementById('today-view');
  const today=todayStr();
  // 今日が期間内のサブタスクを収集（完了・未完了両方）
  const todayTasks=[];
  const undatedTasks=[];
  DB.projects.forEach(p=>{
    p.subtasks.forEach(s=>{
      if(!s.startDate&&!s.endDate){
        // 日付未設定→未定リスト（未完了のみ。完了したらアーカイブ扱いで非表示）
        if(!s.done) undatedTasks.push({...s,projId:p.id,projColor:p.color,projTitle:p.title});
      } else if(s.startDate<=today&&s.endDate>=today){
        todayTasks.push({...s,projId:p.id,projColor:p.color,projTitle:p.title});
      }
    });
  });
  // 手動追加ブロック（subなし）も含める
  const manualBlocks=DB.blocks.filter(b=>b.date===today&&!b.sub);
  const todayBlocks=[...todayTasks.map(s=>({
    id:s.id,title:s.text,sub:s.id,done:s.done,
    duration:s.duration||0,projColor:s.projColor,projId:s.projId,isSub:true,
    projTitle:s.projTitle,carriedOver:s.carriedOver,
    startDate:s.startDate,endDate:s.endDate
  })),...manualBlocks];

  // 合計時間・完了時間
  const doneMin=todayBlocks.filter(b=>b.done).reduce((s,b)=>s+(b.duration||0),0);
  const blockTotal=todayBlocks.reduce((s,b)=>s+(b.duration||0),0);
  const denomMin=blockTotal>0?blockTotal:0;
  const pct=denomMin>0?Math.round(doneMin/denomMin*100):0;
  const r=26, circ=2*Math.PI*r;
  const offset=circ*(1-pct/100);

  const d=new Date();
  const dateStr=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
  const hour=new Date().getHours();
  const greetList=hour<12?['おはよう！今日もいい一日にしよう！','朝だよ！一緒にがんばろう！']:
    hour<17?['こんにちは！午後も一緒に頑張ろう！','お昼過ぎ。休憩した？']:
    ['お疲れ様！今日もよくがんばったね！','夜も無理しないでね🌙'];
  const greetMsg=greetList[Math.floor(Math.random()*greetList.length)];

  const totalH=Math.floor(denomMin/60), totalM=denomMin%60;
  const doneH=Math.floor(doneMin/60), doneM=doneMin%60;
  const totalLabel=denomMin>0?`${totalH}h${String(totalM).padStart(2,'0')}m`:'--';
  const doneLabel=`${doneH}h${String(doneM).padStart(2,'0')}m`;

  let html=`
  <div class="today-top">
    <div class="today-char-area" onclick="randomSpeech()">
      <div class="char-bubble" id="char-bubble">${greetMsg}</div>
      <img id="char-img" src="" alt="キャラクター">
    </div>
    <div class="today-stats-area">
      <div class="today-date-row">
        <div class="today-date">${dateStr}</div>
      </div>
      <div class="circle-wrap">
        <svg class="circle-svg" viewBox="0 0 64 64">
          <circle class="circle-bg" cx="32" cy="32" r="${r}"/>
          <circle class="circle-fg" cx="32" cy="32" r="${r}"
            stroke-dasharray="${circ.toFixed(1)}"
            stroke-dashoffset="${offset.toFixed(1)}"
            transform="rotate(-90 32 32)"/>
          <text x="32" y="29" text-anchor="middle" class="cpct" style="font-size:0.78rem;fill:var(--accent);font-family:'DM Mono',monospace;font-weight:700">${pct}%</text>
          <text x="32" y="40" text-anchor="middle" class="csub" style="font-size:0.55rem;fill:var(--muted);font-family:'DM Mono',monospace">${doneLabel}</text>
        </svg>
        <div class="circle-info">
          <div class="circle-pct-text">${pct}% 完了</div>
          <div class="circle-sub-text">完了：${doneLabel}</div>
          <div class="circle-sub-text">合計：${totalLabel}</div>
        </div>
      </div>

    </div>
  </div>`;

  // 今日のタスク一覧（時間帯なし）
  html+=`<div class="time-block">
    <div class="block-header">
      <span class="block-label">今日のタスク</span>
      <div class="block-progress"><div class="block-progress-inner" style="width:${pct}%"></div></div>
      <span class="block-count">${todayBlocks.filter(b=>b.done).length}/${todayBlocks.length}</span>
    </div>
    ${todayBlocks.map(b=>`<div class="task-item${b.done?' done':''}" style="cursor:pointer" onclick="openDetailFromToday('${b.id}','${b.projId||''}')">
      <input type="checkbox" class="task-check"${b.done?' checked':''} onclick="event.stopPropagation()" onchange="toggleBlock('${b.id}',this.checked)">
      <span class="task-name${b.done?' done':''}">
        ${b.title}${b.carriedOver?'<span style="font-size:0.65rem;background:#d4a843;color:#fff;border-radius:4px;padding:1px 5px;margin-left:5px">昨日から</span>':''}
        <span style="font-size:0.65rem;color:var(--muted);margin-left:6px">${b.projTitle||''}</span>
        ${(b.startDate||b.endDate)?`<span style="font-size:0.62rem;color:var(--muted);margin-left:6px">${b.startDate?b.startDate.slice(5).replace('-','/'):''} ${b.endDate&&b.endDate!==b.startDate?'〜'+b.endDate.slice(5).replace('-','/'):''}${b.endDate===b.startDate?'(1日)':''}</span>`:''}
      </span>
      ${b.duration?`<span class="task-duration">${Math.floor(b.duration/60)?Math.floor(b.duration/60)+'h':''} ${b.duration%60?b.duration%60+'m':''}</span>`:''}
      <button class="task-del" onclick="deleteBlock('${b.id}')">✕</button>
    </div>`).join('')}
    ${todayBlocks.length===0?'<div style="padding:14px 16px;color:var(--muted);font-size:0.82rem">今日のタスクはありません</div>':''}
    <button class="add-block-btn" onclick="openAddBlock('今日','${today}')">＋ タスクを追加</button>
  </div>`;

  // 未定タスク欄
  if(undatedTasks.length>0){
    html+='<div class="time-block" style="margin-top:10px"><div class="block-header"><span class="block-label" style="color:var(--muted)">📋 未定・いつかやる</span></div>';
    undatedTasks.forEach(s=>{
      html+=`<div class="task-item${s.done?' done':''}">
        <input type="checkbox" class="task-check"${s.done?' checked':''} onchange="toggleBlock('${s.id}',this.checked)">
        <span class="task-name${s.done?' done':''}">${s.text} <span style="font-size:0.65rem;color:var(--muted)">${s.projTitle}</span></span>
      </div>`;
    });
    html+='</div>';
  }

  el.innerHTML=html;
  updateCharImg();
}

function addSuggestedToBlock(){
  const today=todayStr();
  const blockedSubIds=DB.blocks.filter(b=>b.date===today&&b.sub).map(b=>b.sub);
  let added=0;
  DB.projects.forEach(p=>{
    p.subtasks.forEach(s=>{
      if(!s.done&&s.startDate<=today&&s.endDate>=today&&!blockedSubIds.includes(s.id)){
        const h=new Date().getHours();
        const time=h<12?'午前':h<17?'午後':'夜';
        DB.blocks.push({id:'b'+Date.now()+added,date:today,time,title:s.text,sub:s.id,done:false,duration:s.duration,projId:p.id});
        added++;
      }
    });
  });
  save(DB); renderToday(); setBubble('今日のタスクを追加したよ！');
}
function toggleBlock(id,checked){
  // サブタスクを直接更新
  let projId=null;
  DB.projects.forEach(p=>{
    const s=p.subtasks.find(x=>x.id===id);
    if(s){ s.done=checked; projId=p.id; }
  });
  // チェック状態を別保存
  if(projId){
    const checks=loadChecks();
    checks[projId+'_'+id]=checked;
    saveChecks(checks);
  }
  // 手動ブロックの場合も更新
  const b=DB.blocks.find(x=>x.id===id);
  if(b) b.done=checked;
  save(DB);
  if(checked) praiseSpeech();
  renderToday();
}
function deleteBlock(id){
  DB.blocks=DB.blocks.filter(x=>x.id!==id);
  save(DB); renderToday();
}
function openAddBlock(time,date){
  let subOptions='<option value="">（なし）</option>';
  DB.projects.forEach(p=>{
    p.subtasks.filter(s=>!s.done).forEach(s=>{
      subOptions+=`<option value="${p.id}|||${s.id}">${p.title}：${s.text}</option>`;
    });
  });
  showModal(`<h3>タスクを追加</h3>
    <div class="modal-field"><label>タイトル</label><input id="m-title" placeholder="タスク名"></div>
    <div class="modal-field"><label>既存タスクから選ぶ</label><select id="m-sub">${subOptions}</select></div>
    <div class="modal-field"><label>時間（分）</label><input id="m-dur" type="number" placeholder="30"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-ok" onclick="doAddBlock('今日','${date}')">追加</button>
    </div>`);
}
function doAddBlock(time,date){
  const title=document.getElementById('m-title').value;
  const subVal=document.getElementById('m-sub').value;
  const dur=parseInt(document.getElementById('m-dur').value)||0;
  let finalTitle=title, sub='', projId='';
  if(subVal){
    const [pId,sId]=subVal.split('|||');
    projId=pId; sub=sId;
    const p=DB.projects.find(x=>x.id===pId);
    const s=p&&p.subtasks.find(x=>x.id===sId);
    if(!finalTitle&&s) finalTitle=s.text;
  }
  if(!finalTitle) return;
  DB.blocks.push({id:'b'+Date.now(),date,time,title:finalTitle,sub,done:false,duration:dur,projId});
  save(DB); closeModal(); renderToday();
}

// ===================== カレンダー =====================
function renderCalendar(){
  const el=document.getElementById('calendar-view');
  const today=todayStr();
  const firstDay=new Date(calYear,calMonth,1);
  let startDow=firstDay.getDay();
  startDow=startDow===0?6:startDow-1;
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();

  // タスク期間のみ（未完了のみ表示）
  const tasksByDate={};
  DB.projects.forEach(p=>{
    if(p.deadline){
      if(!tasksByDate[p.deadline]) tasksByDate[p.deadline]=[];
      tasksByDate[p.deadline].push({text:'〆'+p.title,color:p.color});
    }
    // 全期間の日付に表示
    p.subtasks.filter(s=>!s.done).forEach(s=>{
      if(!s.startDate||!s.endDate) return;
      const start=new Date(s.startDate), end=new Date(s.endDate);
      for(let dd=new Date(start);dd<=end;dd.setDate(dd.getDate()+1)){
        const ds=fmtDate(dd);
        if(!tasksByDate[ds]) tasksByDate[ds]=[];
        tasksByDate[ds].push({text:s.text,color:p.color});
      }
    });
  });

  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dn=['月','火','水','木','金','土','日'];
  let cells='';
  for(let i=startDow-1;i>=0;i--){
    cells+=`<div class="cal-cell other-month"><div class="cal-date-num">${daysInPrev-i}</div></div>`;
  }
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday=ds===today;
    const dayTasks=tasksByDate[ds]||[];
    const mini=dayTasks.slice(0,3).map(t=>`<div class="cal-task-mini" style="background:${t.color}">${t.text}</div>`).join('');
    cells+=`<div class="cal-cell${isToday?' today-cell':''}" onclick="openCalDay('${ds}')">
      <div class="cal-date-num">${day}</div>${mini}
    </div>`;
  }
  const remaining=(7-(startDow+daysInMonth)%7)%7;
  for(let d=1;d<=remaining;d++) cells+=`<div class="cal-cell other-month"><div class="cal-date-num">${d}</div></div>`;

  // 締め切り一覧
  const todayD=new Date(today);
  // 締め切りアイテムを配列に集めてdiffでソート
  const dlList=[];
  // プロジェクト締め切りとサブタスク締め切りを全部まとめて収集
  DB.projects.forEach(p=>{
    if(!p.deadline) return;
    const diff=Math.ceil((new Date(p.deadline)-todayD)/86400000);
    const [badge,label]=diff<0?['dl-urgent','期限切れ']:diff<=3?['dl-urgent',`残${diff}日`]:diff<=7?['dl-soon',`残${diff}日`]:['dl-ok',`残${diff}日`];
    dlList.push({diff,html:`<div class="deadline-item"><span class="dl-badge ${badge}">${label}</span><span>${p.title}</span><span style="margin-left:auto;font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted)">${p.deadline}</span></div>`});
    p.subtasks.forEach(s=>{
      if(!s.endDate||s.done) return;
      const sdiff=Math.ceil((new Date(s.endDate)-todayD)/86400000);
      const [sb,sl]=sdiff<0?['dl-urgent','期限切れ']:sdiff<=2?['dl-urgent',`残${sdiff}日`]:sdiff<=5?['dl-soon',`残${sdiff}日`]:['dl-ok',`残${sdiff}日`];
      dlList.push({diff:sdiff,html:`<div class="deadline-item"><span class="dl-badge ${sb}">${sl}</span><span style="color:var(--muted);font-size:0.72rem">${p.title}›</span><span style="margin-left:3px">${s.text}</span><span style="margin-left:auto;font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted)">${s.endDate}</span></div>`});
    });
  });
  // 残り日数の少ない順にソート（マイナス＝期限切れが最優先）
  dlList.sort((a,b)=>a.diff-b.diff);
  const dlItems=dlList.map(d=>d.html).join('');

  el.innerHTML=`
  <div class="cal-nav">
    <button onclick="calMove(-1)">◀</button>
    <h2>${calYear}年 ${mn[calMonth]}</h2>
    <button onclick="calMove(1)">▶</button>
  </div>
  <div class="cal-grid">
    ${dn.map(d=>`<div class="cal-day-header">${d}</div>`).join('')}${cells}
  </div>
  <div id="cal-bottom">
    <h3>📌 締め切り・期日一覧（2週間以内）</h3>
    ${dlItems||'<span style="color:var(--muted);font-size:0.8rem">締め切りが近いタスクはありません</span>'}
  </div>`;
}
function calMove(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
function openCalDay(ds){
  // 完了・未完了両方取得
  const allTasks=[];
  DB.projects.forEach(p=>{
    p.subtasks.forEach(s=>{
      if(s.startDate&&s.endDate&&s.startDate<=ds&&s.endDate>=ds){
        allTasks.push({...s,projColor:p.color,projTitle:p.title,projId:p.id});
      }
    });
  });
  const deadlines=DB.projects.filter(p=>p.deadline===ds);

  function buildCalDayHtml(){
    const taskRows=allTasks.length?allTasks.map(s=>`
      <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:${s.done?'rgba(0,0,0,0.04)':'rgba('+hexToRgb(s.projColor)+',0.12)'};margin-bottom:4px;opacity:${s.done?0.6:1}">
        <input type="checkbox" ${s.done?'checked':''} style="accent-color:${s.projColor};width:15px;height:15px;flex-shrink:0" onchange="toggleCalTask('${s.projId}','${s.id}',this.checked,'${ds}')">
        <span style="font-size:0.82rem;flex:1;${s.done?'text-decoration:line-through;color:var(--muted)':''}">${s.projTitle}：${s.text}</span>
      </div>`).join('')
      :'<div style="font-size:0.8rem;color:var(--muted)">この日に予定のタスクはありません</div>';
    const dlHtml=deadlines.length?deadlines.map(p=>`<div class="cal-modal-task" style="background:${p.color};margin-bottom:4px">〆 ${p.title}</div>`).join(''):'';
    return `<h3 style="margin-bottom:10px">${ds}</h3>
      ${dlHtml}
      <div style="font-size:0.76rem;color:var(--muted);margin:8px 0 6px">この日が期間内のタスク</div>
      <div id="cal-day-tasks">${taskRows}</div>
      <div class="modal-btns" style="margin-top:12px"><button class="btn-cancel" onclick="closeModal()">閉じる</button></div>`;
  }

  showModal(buildCalDayHtml());
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function toggleCalTask(projId,subId,checked,ds){
  const p=DB.projects.find(x=>x.id===projId);
  const s=p&&p.subtasks.find(x=>x.id===subId);
  if(s) s.done=checked;
  save(DB);
  if(checked) praiseSpeech();
  // カレンダーを再描画してポップアップを更新
  renderCalendar();
  openCalDay(ds);
}

// ===================== ボード =====================
function renderBoard(){
  const el=document.getElementById('board-view');
  if(!DB.boardMonths) DB.boardMonths=['2026-06'];

  const monthTabs=DB.boardMonths.map(m=>`<button class="month-tab${m===activeBoardMonth?' active':''}" onclick="switchBoardMonth('${m}')">${m}</button>`).join('');

  const [yr,mo]=activeBoardMonth.split('-');
  const monthStart=`${yr}-${mo}-01`;
  const monthEnd=`${yr}-${mo}-${new Date(parseInt(yr),parseInt(mo),0).getDate()}`;

  let colsHtml='';
  DB.projects.forEach(p=>{
    const isCollapsed=p.collapsed||false;
    // この月に関係するサブタスクのみ
    const relevantSubs=p.subtasks.filter(s=>{
      if(s.carryover) return s.carryoverMonth===activeBoardMonth;
      // 開始日か終了日がこの月の範囲内、またはタスク期間がこの月を跨ぐ
      return s.startDate<=monthEnd && s.endDate>=monthStart;
    });
    if(relevantSubs.length===0) return; // この月に関係なければ列自体非表示

    const subtaskRows=relevantSubs.map(s=>{
      const isSelected=selectedSubtask&&selectedSubtask.id===s.id&&selectedProjId===p.id;
      const carryBadge=s.carryover?'<span class="carryover-badge">引継</span>':'';
      return `<div class="subtask-row${isSelected?' selected':''}" onclick="openDetail('${p.id}','${s.id}')">
        <input type="checkbox" class="subtask-check"${s.done?' checked':''} onclick="event.stopPropagation()" onchange="toggleSubtask('${p.id}','${s.id}',this.checked)">
        <span class="subtask-name${s.done?' done':''}">${s.text}</span>
        ${carryBadge}
        ${s.duration?`<span class="subtask-dur">${Math.floor(s.duration/60)}h</span>`:''}
        <button class="subtask-delete" onclick="event.stopPropagation();deleteSubtask('${p.id}','${s.id}')" title="削除">🗑</button>
      </div>`;
    }).join('');

    colsHtml+=`<div class="board-col">
      <div class="board-col-header">
        <div class="col-color" style="background:${p.color}"></div>
        <span class="col-title">${p.title}</span>
        <button class="col-del-btn" onclick="deleteProject('${p.id}')" title="カテゴリを削除">🗑</button>
        <span class="col-toggle${isCollapsed?' collapsed':''}" onclick="toggleColCollapse('${p.id}')">▼</span>
      </div>
      <div class="board-col-body${isCollapsed?' collapsed':''}">
        ${subtaskRows}
        <button class="add-subtask-btn" onclick="openAddSubtask('${p.id}')">＋ タスクを追加</button>
      </div>
    </div>`;
  });

  if(!colsHtml) colsHtml='<div style="color:var(--muted);font-size:0.85rem;padding:20px">この月に表示するタスクがありません</div>';

  el.innerHTML=`
  <div class="board-header">
    <h2>ボード</h2>
    ${monthTabs}
    <button onclick="addBoardMonth()" style="padding:4px 11px;border:1px dashed var(--accent2);border-radius:20px;background:none;cursor:pointer;font-size:0.77rem;color:var(--accent)">＋ 月を追加</button>
    <button onclick="carryoverUnfinished()" style="padding:4px 11px;border:1px solid var(--yellow);border-radius:20px;background:rgba(212,168,67,0.09);cursor:pointer;font-size:0.77rem;color:#a07020">未達を翌月へ引継ぎ</button>
  </div>
  <div class="board-cols">${colsHtml}</div>`;
}
function switchBoardMonth(m){ activeBoardMonth=m; renderBoard(); }
function addBoardMonth(){
  const months=DB.boardMonths||[];
  const last=months[months.length-1]||'2026-06';
  const [y,m]=last.split('-').map(Number);
  let ny=y,nm=m+1;
  if(nm>12){nm=1;ny++;}
  const next=`${ny}-${String(nm).padStart(2,'0')}`;
  if(!months.includes(next)){ DB.boardMonths=[...months,next]; save(DB); }
  activeBoardMonth=next; renderBoard();
}
function carryoverUnfinished(){
  const cur=activeBoardMonth;
  const [y,m]=cur.split('-').map(Number);
  let ny=y,nm=m+1;
  if(nm>12){nm=1;ny++;}
  const next=`${ny}-${String(nm).padStart(2,'0')}`;
  const [cy,cm]=cur.split('-');
  const monthEnd=`${cy}-${cm}-${new Date(parseInt(cy),parseInt(cm),0).getDate()}`;
  let count=0;
  DB.projects.forEach(p=>{
    p.subtasks.forEach(s=>{
      if(!s.done&&s.endDate<=monthEnd&&!s.carryover){ s.carryover=true; s.carryoverMonth=next; count++; }
    });
  });
  if(!DB.boardMonths.includes(next)){ DB.boardMonths=[...(DB.boardMonths||[]),next]; }
  activeBoardMonth=next;
  save(DB); renderBoard();
  setBubble(`${count}件のタスクを${next}に引き継いだよ！無理なく進もう🐻`);
}

// ===================== 共通：プロジェクトリスト描画 =====================
function buildProjectHtml(p, viewKey){
  const isCollapsed = p['collapsed_'+viewKey] !== false ? (p['collapsed_'+viewKey] || true) : false;
  const done = p.subtasks.filter(s=>s.done).length;
  const total = p.subtasks.length;
  const pct = total>0 ? Math.round(done/total*100) : 0;
  const showDone = p['showDone_'+viewKey] || false;
  const activeSubs = p.subtasks.filter(s=>!s.done);
  const doneSubs = p.subtasks.filter(s=>s.done);

  return `<div class="board-col" style="margin-bottom:0">
    <div class="board-col-header" style="cursor:pointer;padding:10px 13px" onclick="toggleViewCollapse('${p.id}','${viewKey}')">
      <div class="col-color" style="background:${p.color};width:10px;height:10px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1">
        <span class="col-title" style="font-size:0.85rem">${p.title}</span>
        ${p.orderedDate?`<span style="display:block;font-size:0.62rem;color:var(--muted)">受注：${p.orderedDate}</span>`:''}
      </div>
      <span style="font-size:0.7rem;color:var(--muted);margin-right:6px;white-space:nowrap">${done}/${total}</span>
      <div style="width:60px;height:4px;background:var(--border);border-radius:3px;overflow:hidden;margin-right:6px;flex-shrink:0">
        <div style="width:${pct}%;height:100%;background:${p.color};border-radius:3px;transition:width .4s"></div>
      </div>
      <button class="col-del-btn" onclick="event.stopPropagation();deleteProject('${p.id}')" title="削除">🗑</button>
      <span class="col-toggle${isCollapsed?' collapsed':''}">▶</span>
    </div>
    <div class="board-col-body${isCollapsed?' collapsed':''}">
      ${activeSubs.map(s=>{
        const sel = selectedSubtask&&selectedSubtask.id===s.id&&selectedProjId===p.id;
        return `<div class="subtask-row${sel?' selected':''}" onclick="openDetail('${p.id}','${s.id}')">
          <input type="checkbox" class="subtask-check" onclick="event.stopPropagation()" onchange="toggleSubtask('${p.id}','${s.id}',this.checked)">
          <span class="subtask-name">
            ${s.text}
            ${s.startDate?`<span style="font-size:0.65rem;color:var(--muted);margin-left:6px">${s.startDate.slice(5).replace('-','/')}〜${s.endDate?s.endDate.slice(5).replace('-','/'):''}</span>`:''}
          </span>
          ${s.duration?`<span class="subtask-dur">${Math.floor(s.duration/60)?Math.floor(s.duration/60)+'h':''}${s.duration%60?s.duration%60+'m':''}</span>`:''}
          <button class="subtask-delete" onclick="event.stopPropagation();deleteSubtask('${p.id}','${s.id}')" title="削除">🗑</button>
        </div>`;
      }).join('')}
      ${doneSubs.length>0?`
        <div style="padding:4px 13px">
          <button onclick="event.stopPropagation();toggleShowDone('${p.id}','${viewKey}')" style="font-size:0.72rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 0">
            ${showDone?'▲ 完了済みを隠す':'▼ 完了済み '+doneSubs.length+'件を表示'}
          </button>
        </div>
        ${showDone?doneSubs.map(s=>`<div class="subtask-row" style="opacity:0.5" onclick="openDetail('${p.id}','${s.id}')">
          <input type="checkbox" class="subtask-check" checked onclick="event.stopPropagation()" onchange="toggleSubtask('${p.id}','${s.id}',this.checked)">
          <span class="subtask-name done">${s.text}</span>
          <button class="subtask-delete" onclick="event.stopPropagation();deleteSubtask('${p.id}','${s.id}')" title="削除">🗑</button>
        </div>`).join(''):''}
      `:''}
      <button class="add-subtask-btn" onclick="openAddSubtask('${p.id}')">＋ タスクを追加</button>
    </div>
  </div>`;
}

function toggleShowDone(projId, viewKey){
  const p = DB.projects.find(x=>x.id===projId);
  if(p) p['showDone_'+viewKey] = !p['showDone_'+viewKey];
  if(viewKey==='all') renderAllTasks();

function renderCommissions(){

  const tanzoActive = DB.projects.filter(p => isTanzo(p) && !isAllDone(p));
  const tanzoArchived = DB.projects.filter(p => isTanzo(p) && isAllDone(p));
  const atelierActive = DB.projects.filter(p => isAtelier(p) && !isAllDone(p));
  const atelierArchived = DB.projects.filter(p => isAtelier(p) && isAllDone(p));

  function buildSection(title, color, active, archived){
    let s = `<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div style="width:12px;height:12px;border-radius:50%;background:${color}"></div>

      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start">`;
    active.forEach(p=>{ s+=buildProjectHtml(p,'commissions'); });
    s+='</div>';
    if(archived.length>0) s+=buildArchiveSection(archived,'commissions');
    s+='</div>';
    return s;
  }

  let html = `<div style="margin-bottom:14px">
    <h2 style="font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--accent)">制作依頼</h2>
    <button onclick="openNewCommission()" style="margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 16px;font-size:0.8rem;cursor:pointer">＋ 新規依頼を追加</button>
  </div>`;

  html += buildSection('TANZO', '#6a8a5a', tanzoActive, tanzoArchived);
  html += buildSection('ateliertouca', '#b07aa0', atelierActive, atelierArchived);

  el.innerHTML = html;
}

// ===================== アーカイブセクション =====================
function isAllDone(p){ return p.subtasks.length>0 && p.subtasks.every(s=>s.done); }

function buildArchiveSection(projects, viewKey){
  const isOpen = window['archive_open_'+viewKey] || false;
  const rows = projects.map(p=>buildProjectHtml(p,viewKey)).join('');
  return `<div style="margin-top:20px;border-top:1px dashed var(--border);padding-top:14px">
    <div style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:10px" onclick="toggleArchive('${viewKey}')">

    </div>
    <div style="display:${isOpen?'block':'none'}" id="archive-section-${viewKey}">${rows}</div>
  </div>`;
}

function toggleArchive(viewKey){
  window['archive_open_'+viewKey] = !window['archive_open_'+viewKey];
  if(viewKey==='all') renderAllTasks();
  else if(viewKey==='commissions') renderCommissions();
  else renderMonthly();

// ===================== 全タスクビュー =====================
function renderAllTasks(){
  const el = document.getElementById('alltasks-view');
  const active = DB.projects.filter(p => !isAllDone(p));
  const archived = DB.projects.filter(p => isAllDone(p));

  // その他・突発タスクを先頭に、残りを後ろに
  const otherProj = active.find(p=>p.id==='other');
  const restProj = active.filter(p=>p.id!=='other');
  const ordered = otherProj ? [otherProj, ...restProj] : restProj;

  // デフォルトで全部折りたたむ（collapsed_allがundefinedなら折りたたみ）
  ordered.forEach(p=>{ if(p['collapsed_all']===undefined) p['collapsed_all']=true; });

  let html = '<div style="margin-bottom:14px"><h2 style=\'font-family:\'DM Serif Display\',serif;font-size:1.25rem;color:var(--accent)\'>全タスク一覧</h2></div>';
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start">';
  ordered.forEach(p => { html += buildProjectHtml(p,'all'); });
  html += '</div>';
  if(archived.length>0) html += buildArchiveSection(archived,'all');
  el.innerHTML = html;
}

function renderMonthly(){
  const el=document.getElementById('monthly-view');
  
  // 月タブを生成（2026年6月〜12月）
  const months=['2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];
  const monthNames={'2026-06':'6月','2026-07':'7月','2026-08':'8月','2026-09':'9月','2026-10':'10月','2026-11':'11月','2026-12':'12月'};
  
  const tabs=months.map(m=>`<button class="month-tab${m===activeMonth?' active':''}" onclick="switchMonth('${m}')">${monthNames[m]}</button>`).join('');
  
  // アクティブ月のタスク表示
  const [yr,mo]=activeMonth.split('-');
  const monthStart=`${yr}-${mo}-01`;
  const monthEnd=`${yr}-${mo}-${new Date(parseInt(yr),parseInt(mo),0).getDate()}`;
  
  let colsHtml='';
  let hasAny=false;
  
  DB.projects.forEach(p=>{
    const subs=p.subtasks.filter(s=>s.startDate<=monthEnd&&s.endDate>=monthStart);

    hasAny=true;
    const isCollapsed=p['collapsed_monthly_'+activeMonth]||false;

      <div class="board-col-header" style="cursor:pointer" onclick="toggleViewCollapse('${p.id}','monthly_${activeMonth}')">

        <span class="col-toggle${isCollapsed?' collapsed':''}">▼</span>
      </div>
      <div class="board-col-body${isCollapsed?' collapsed':''}">
        ${subs.map(s=>{
          const isSelected=selectedSubtask&&selectedSubtask.id===s.id&&selectedProjId===p.id;
          return `<div class="subtask-row${isSelected?' selected':''}" onclick="openDetail('${p.id}','${s.id}')">
            <input type="checkbox" class="subtask-check"${s.done?' checked':''} onclick="event.stopPropagation()" onchange="toggleSubtask('${p.id}','${s.id}',this.checked)">
            <span class="subtask-name${s.done?' done':''}">
              ${s.text}
              <span style="font-size:0.65rem;color:var(--muted);margin-left:6px">${s.startDate.slice(5).replace('-','/')}〜${s.endDate.slice(5).replace('-','/')}</span>
            </span>
            ${s.duration?`<span class="subtask-dur">${Math.floor(s.duration/60)?Math.floor(s.duration/60)+'h':''}${s.duration%60?s.duration%60+'m':''}</span>`:''}
            <button class="subtask-delete" onclick="event.stopPropagation();deleteSubtask('${p.id}','${s.id}')" title="削除">🗑</button>
          </div>`;
        }).join('')}
        <button class="add-subtask-btn" onclick="openAddSubtask('${p.id}')">＋ タスクを追加</button>
      </div>
    </div>`;
  });
  
  if(!hasAny) colsHtml='<div style="color:var(--muted);font-size:0.85rem;padding:20px">この月のタスクはありません</div>';
  
  el.innerHTML=`
    <div class="board-header" style="margin-bottom:14px">
      <h2 style="font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--accent)">月別タスク</h2>
      ${tabs}
    </div>
    <div>${colsHtml}</div>`;
}

}

      <button onclick="exportData()" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 13px;font-size:0.78rem;cursor:pointer">エクスポート</button>
      <button onclick="importData()" style="background:var(--border);border:none;border-radius:8px;padding:6px 13px;font-size:0.78rem;cursor:pointer">インポート</button>
      <button onclick="resetData()" style="background:none;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:6px 13px;font-size:0.78rem;cursor:pointer">リセット</button>
    </div>
  </div>`;
}
function saveCharName(){ DB.charName=document.getElementById('s-charname').value; save(DB); }
function loadCharImg(input){
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{ DB.charImg=e.target.result.split(',')[1]; save(DB); updateCharImg(); renderSettings(); };
  r.readAsDataURL(file);
}
function openAddProject(){
  showModal(`<h3>プロジェクトを追加</h3>
    <div class="modal-field"><label>名前</label><input id="m-ptitle"></div>
    <div class="modal-field"><label>色</label><input id="m-pcolor" type="color" value="#5c7c6a"></div>
    <div class="modal-field"><label>締め切り</label><input id="m-pdeadline" type="date"></div>
    <div class="modal-field"><label>メモ</label><input id="m-pmemo"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-ok" onclick="doAddProject()">追加</button>
    </div>`);
}
function doAddProject(){
  const title=document.getElementById('m-ptitle').value.trim();
  if(!title) return;
  DB.projects.push({id:'p'+Date.now(),title,color:document.getElementById('m-pcolor').value,deadline:document.getElementById('m-pdeadline').value,duration:0,memo:document.getElementById('m-pmemo').value,subtasks:[]});
  save(DB); closeModal(); renderSettings();
}
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));
  a.download='task-secretary-backup.json'; a.click();
}
function importData(){
  const input=document.createElement('input'); input.type='file'; input.accept='.json';
  input.onchange=e=>{
    const r=new FileReader();
    r.onload=ev=>{ try{DB=JSON.parse(ev.target.result);save(DB);renderSettings();setBubble('データをインポートしたよ！');}catch{alert('読み込み失敗');} };
    r.readAsText(e.target.files[0]);
  }; input.click();
}
function resetData(){
  if(!confirm('全データをリセットしますか？')) return;
  DB=defaultData(); save(DB); showView('today');
}

// ===================== モーダル =====================
function showModal(html){ document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal-container').innerHTML=''; }

function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

window.onload=()=>{
  // 初回のみdefaultDataで初期化
  if(!localStorage.getItem(KEY)){
    DB = applyChecks(defaultData());
    localStorage.setItem(KEY, JSON.stringify(DB));
  }

  // defaultDataに新しく追加されたプロジェクトだけlocalStorageに追加（既存は一切触らない）
  const defaultProjects = defaultData().projects;
  const existingIds = DB.projects.map(p=>p.id);
  let newAdded = false;
  defaultProjects.forEach(dp=>{
    if(!existingIds.includes(dp.id)){
      DB.projects.push(dp);
      newAdded = true;
    }
  });
  if(newAdded) save(DB, false);

  // 前日の未完了タスクを今日に持ち越す
  carryOverYesterday();

  renderToday();
  updateCharImg();
};

function carryOverYesterday(){
  const today = todayStr();
  let carried = 0;

  // 未完了サブタスクで終了日が今日より前のものを全部今日にずらす（数日サボってもOK）
  DB.projects.forEach(p=>{
    p.subtasks.forEach(s=>{
      if(s.done) return;
      if(s.endDate && s.endDate < today){
        s.startDate = today;
        s.endDate = today;
        s.carriedOver = true;
        carried++;
      }
    });
  });

  if(carried > 0){
    save(DB, false);
    setTimeout(()=>setBubble(`${carried}件のやり残しを今日に持ち越したよ！無理せず少しずつね🐻`), 500);
  }
}
</script>
